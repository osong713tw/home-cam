<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="監看">
  <meta name="theme-color" content="#000000">
  <meta name="referrer" content="no-referrer">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>監看｜家用監視器</title>
  <link rel="stylesheet" href="css/style.css?v=14">
</head>
<body class="page-viewer theme-dark">
  <main id="grid" class="grid" data-count="0"></main>
  <div id="empty" class="empty">
    <div class="spinner"></div>
    <p id="emptyText">正在尋找鏡頭…</p>
    <span class="small">請確認鏡頭手機正在拍攝</span>
  </div>

  <header class="vtop">
    <div class="chip glass" id="status"><span class="dot wait"></span><span id="statusText">準備中</span></div>
  </header>

  <button type="button" id="alarmBar" class="alarm-bar hidden">
    <svg class="ic"><use href="icons/sprite.svg?v=14#belloff"/></svg>
    <span class="row-text"><b>停止警報</b><small id="alarmCams"></small></span>
  </button>

  <nav class="dock glass" aria-label="監看控制">
    <a class="dock-btn btn" href="index.html" aria-label="回首頁" style="background:transparent"><svg class="ic"><use href="icons/sprite.svg?v=14#house"/></svg></a>
    <span class="dock-sep"></span>
    <button type="button" class="dock-btn" id="btnSound" aria-label="警示音開關"><svg class="ic"><use href="icons/sprite.svg?v=14#bell"/></svg></button>
    <button type="button" class="dock-btn" id="btnMotion" aria-label="移動偵測設定"><svg class="ic"><use href="icons/sprite.svg?v=14#motion"/></svg></button>
    <button type="button" class="dock-btn" id="btnLog" aria-label="移動紀錄"><svg class="ic"><use href="icons/sprite.svg?v=14#list"/></svg><span class="badge hidden" id="logBadge">0</span></button>
    <button type="button" class="dock-btn" id="btnShare" aria-label="邀請其他監看裝置"><svg class="ic"><use href="icons/sprite.svg?v=14#share"/></svg></button>
  </nav>

  <!-- 開始畫面 -->
  <div id="startOverlay" class="overlay">
    <div class="card">
      <div class="hero-icon green"><svg class="ic"><use href="icons/sprite.svg?v=14#tv"/></svg></div>
      <h1>監看模式</h1>
      <div id="noKey" class="hidden">
        <p class="lead">找不到房間資訊。</p>
        <p class="note" style="text-align:center">請回首頁點「加入監看」</p>
        <a class="btn primary cta" href="index.html" style="color:#fff;background:var(--blue)">回首頁</a>
      </div>
      <div id="hasKey">
        <p class="lead">即時觀看所有鏡頭</p>
        <ul class="features">
          <li><svg class="ic"><use href="icons/sprite.svg?v=14#plus"/></svg><div><b>點畫面放大</b></div></li>
          <li><svg class="ic"><use href="icons/sprite.svg?v=14#spk"/></svg><div><b>點喇叭聽聲音</b></div></li>
          <li><svg class="ic"><use href="icons/sprite.svg?v=14#motion"/></svg><div><b>有動靜會響鈴提醒</b><span>需保持此畫面開啟</span></div></li>
        </ul>
        <button type="button" class="primary cta" id="btnStart">開始監看</button>
      </div>
      <p id="startError" class="error hidden"></p>
      <p class="small"><a href="index.html">回首頁</a></p>
    </div>
  </div>

  <!-- 移動偵測設定 -->
  <div id="motionModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="motionTitle">
    <div class="card">
      <div class="sheet-head">
        <h2 id="motionTitle">移動偵測</h2>
        <button type="button" class="icon-btn" data-close aria-label="關閉"><svg class="ic"><use href="icons/sprite.svg?v=14#xmark"/></svg></button>
      </div>
      <label class="switch"><input type="checkbox" id="chkMotion">啟用移動偵測</label>
      <label class="switch"><input type="checkbox" id="chkSound">偵測到時發出警示音</label>
      <label class="field">靈敏度　<b id="sensVal" style="color:var(--label)">5</b>
        <input type="range" id="rngSens" min="1" max="10" step="1">
        <span class="range-labels"><span>低</span><span>高</span></span>
        <span class="motion-level" id="motionLevel">等待畫面…</span>
      </label>
      <label class="field">警示音長度　<b id="alarmSecVal" style="color:var(--label)">1 秒</b>
        <input type="range" id="rngAlarmSec" min="1" max="60" step="1">
        <span class="range-labels"><span>1 秒</span><span>60 秒</span></span>
      </label>
      <div class="field">警示音
        <div class="tabs" id="alarmStyleTabs" style="margin:8px 0 0">
          <button type="button" class="tab" data-style="beep">嗶嗶聲</button>
          <button type="button" class="tab" data-style="siren">警笛</button>
          <button type="button" class="tab" data-style="chime">鈴聲</button>
        </div>
      </div>
      <p class="small">持續有動靜會繼續響；按「停止警報」後暫停 15 秒</p>
      <div class="row">
        <button type="button" id="btnTestBeep">試聽</button>
        <button type="button" class="primary" data-close>完成</button>
      </div>
    </div>
  </div>

  <!-- 移動紀錄 -->
  <div id="logModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="logTitle">
    <div class="card">
      <div class="sheet-head">
        <h2 id="logTitle">移動紀錄</h2>
        <button type="button" class="icon-btn" data-close aria-label="關閉"><svg class="ic"><use href="icons/sprite.svg?v=14#xmark"/></svg></button>
      </div>
      <ul class="log" id="logList"></ul>
      <div class="row">
        <button type="button" class="danger" id="btnClearLog">清除紀錄</button>
        <button type="button" class="primary" data-close>完成</button>
      </div>
    </div>
  </div>

  <!-- 邀請其他監看裝置 -->
  <div id="shareModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="card">
      <div class="sheet-head">
        <h2 id="shareTitle">邀請裝置</h2>
        <button type="button" class="icon-btn" data-close aria-label="關閉"><svg class="ic"><use href="icons/sprite.svg?v=14#xmark"/></svg></button>
      </div>
      <div class="qr" id="qrBox"></div>
      <p class="note">用「相機」App 掃描即可監看</p>
      <p class="note pin-note">或在首頁點「加入監看」，輸入配對碼 <b id="sharePin">----</b></p>
      <div class="row"><button type="button" class="primary" data-close>完成</button></div>
    </div>
  </div>

  <script src="vendor/peerjs.min.js?v=14"></script>
  <script src="vendor/qrcode.js?v=14"></script>
  <script src="js/config.js?v=14"></script>
  <script src="js/common.js?v=14"></script>
  <script src="js/viewer.js?v=14"></script>
</body>
</html>
