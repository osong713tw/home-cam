<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家用監視器">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>家用監視器</title>
  <link rel="stylesheet" href="css/style.css?v=11">
</head>
<body class="page-home">
  <main class="home">
    <header class="hero">
      <div class="app-icon"><svg class="ic"><use href="icons/sprite.svg?v=11#cam"/></svg></div>
      <h1>家用監視器</h1>
      <p>iPhone 當鏡頭，同一個 Wi-Fi 即時監看</p>
    </header>

    <section class="group">
      <h2 class="group-title">開始使用</h2>
      <div class="list">
        <a class="list-row" href="camera.html" id="goCamera">
          <span class="row-icon blue"><svg class="ic"><use href="icons/sprite.svg?v=11#cam"/></svg></span>
          <span class="row-text"><b>這台當鏡頭</b><small id="camDesc">開始拍攝</small></span>
          <svg class="chev"><use href="icons/sprite.svg?v=11#chev"/></svg>
        </a>
        <a class="list-row hidden" href="viewer.html" id="goViewer">
          <span class="row-icon green"><svg class="ic"><use href="icons/sprite.svg?v=11#play"/></svg></span>
          <span class="row-text"><b>繼續監看</b><small>回到上次的房間</small></span>
          <svg class="chev"><use href="icons/sprite.svg?v=11#chev"/></svg>
        </a>
        <button type="button" class="list-row" id="goJoin">
          <span class="row-icon orange"><svg class="ic"><use href="icons/sprite.svg?v=11#wifi"/></svg></span>
          <span class="row-text"><b>加入監看</b><small>輸入配對碼</small></span>
          <svg class="chev"><use href="icons/sprite.svg?v=11#chev"/></svg>
        </button>
      </div>
    </section>

    <section class="group">
      <h2 class="group-title">注意事項</h2>
      <div class="list">
        <div class="list-row static"><span class="row-icon green"><svg class="ic"><use href="icons/sprite.svg?v=11#bolt"/></svg></span><span class="row-text">鏡頭手機接上充電、螢幕保持開啟</span></div>
        <div class="list-row static"><span class="row-icon teal"><svg class="ic"><use href="icons/sprite.svg?v=11#shield"/></svg></span><span class="row-text">影像不上傳雲端，需配對碼才能看</span></div>
      </div>
    </section>
    <p class="footnote">分享 ›「加入主畫面」，像 App 一樣開啟</p>
  </main>

  <!-- 加入監看 -->
  <div id="joinModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="joinTitle">
    <div class="card">
      <div class="sheet-head">
        <h2 id="joinTitle">加入監看</h2>
        <button type="button" class="icon-btn" id="btnJoinClose" aria-label="關閉"><svg class="ic"><use href="icons/sprite.svg?v=11#xmark"/></svg></button>
      </div>
      <div class="join-status"><div class="spinner small-spinner" id="joinSpinner"></div><p id="joinStatus"></p></div>
      <div id="roomList" class="room-list"></div>
      <form id="pinForm" class="hidden" autocomplete="off">
        <p class="note">房間：<b id="pinRoom"></b></p>
        <input type="text" id="pinInput" class="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="4"
               placeholder="····" aria-label="4 位數配對碼" autocomplete="off">
        <p class="error" id="pinError"></p>
        <div class="row">
          <button type="button" id="btnPinBack">返回</button>
          <button type="submit" class="primary">加入</button>
        </div>
      </form>
      <div class="row">
        <button type="button" id="btnRetry" class="hidden"><svg class="ic"><use href="icons/sprite.svg?v=11#retry"/></svg>重新搜尋</button>
      </div>
    </div>
  </div>

  <script src="vendor/peerjs.min.js?v=11"></script>
  <script src="js/config.js?v=11"></script>
  <script src="js/common.js?v=11"></script>
  <script src="js/join.js?v=11"></script>
  <script>
    (function () {
      function get(n) { try { return JSON.parse(localStorage.getItem('ipcam.' + n)); } catch (e) { return null; } }
      var ok = function (k) { return typeof k === 'string' && /^[A-Za-z0-9_-]{16,64}$/.test(k); };
      var vk = get('view.key');
      if (ok(vk)) {
        var v = document.getElementById('goViewer');
        v.href = 'viewer.html#k=' + vk;
        v.classList.remove('hidden');
      }
      var ck = get('cam.key');
      if (ok(ck)) {
        document.getElementById('goCamera').href = 'camera.html#k=' + ck;
        document.getElementById('camDesc').textContent = '繼續上次的房間';
      }
    })();
  </script>
</body>
</html>
