<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="監視鏡頭">
  <meta name="theme-color" content="#000000">
  <meta name="referrer" content="no-referrer">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>鏡頭｜家用監視器</title>
  <link rel="stylesheet" href="css/style.css?v=13">
</head>
<body class="page-camera theme-dark">
  <video id="preview" autoplay playsinline muted></video>

  <header class="topbar">
    <div class="chip glass" id="status"><span class="dot wait"></span><span id="statusText">準備中</span></div>
    <div class="chip glass" id="camName">鏡頭</div>
    <div class="chip glass" id="viewerCount" title="正在監看的裝置數"><svg class="ic"><use href="icons/sprite.svg?v=13#eye"/></svg><span id="viewerNum">0</span></div>
    <div class="chip glass hidden" id="pinChip" title="配對碼"><svg class="ic"><use href="icons/sprite.svg?v=13#key"/></svg><b id="pinText">----</b></div>
  </header>

  <nav class="dock glass" id="toolbar" aria-label="鏡頭控制">
    <button type="button" class="dock-btn" id="btnFlip" aria-label="切換前後鏡頭"><svg class="ic"><use href="icons/sprite.svg?v=13#flip"/></svg></button>
    <label class="dock-pill" for="selQuality">
      <select id="selQuality" aria-label="畫質">
        <option value="480">480p</option>
        <option value="720">720p</option>
        <option value="1080">1080p</option>
      </select>
    </label>
    <button type="button" class="dock-btn" id="btnMic" aria-label="麥克風"><svg class="ic"><use href="icons/sprite.svg?v=13#mic"/></svg></button>
    <button type="button" class="dock-btn" id="btnBlack" aria-label="黑畫面省電"><svg class="ic"><use href="icons/sprite.svg?v=13#moon"/></svg></button>
    <span class="dock-sep"></span>
    <button type="button" class="dock-btn" id="btnQR" aria-label="QR Code 與配對碼"><svg class="ic"><use href="icons/sprite.svg?v=13#qr"/></svg></button>
    <button type="button" class="dock-btn" id="btnSettings" aria-label="設定"><svg class="ic"><use href="icons/sprite.svg?v=13#gear"/></svg></button>
  </nav>

  <div id="blackout" class="blackout hidden">
    <div class="blackout-hint" id="blackoutHint">拍攝中<br>連點兩下回到畫面</div>
  </div>

  <!-- 開始畫面 -->
  <div id="startOverlay" class="overlay">
    <div class="card">
      <div class="hero-icon"><svg class="ic"><use href="icons/sprite.svg?v=13#cam"/></svg></div>
      <h1>鏡頭模式</h1>
      <p class="lead">這支 iPhone 將成為監視鏡頭</p>
      <p id="joinNote" class="note hidden" style="text-align:center">加入既有的房間</p>
      <ul class="features">
        <li><svg class="ic"><use href="icons/sprite.svg?v=13#bolt"/></svg><div><b>接上充電器</b></div></li>
        <li><svg class="ic"><use href="icons/sprite.svg?v=13#lock"/></svg><div><b>自動鎖定設為「永不」</b></div></li>
        <li><svg class="ic"><use href="icons/sprite.svg?v=13#phone"/></svg><div><b>停留在這個畫面</b><span>鎖屏或切換 App 會中斷拍攝</span></div></li>
      </ul>
      <button type="button" class="primary cta" id="btnStart">開始拍攝</button>
      <p id="startError" class="error hidden"></p>
      <p class="small"><a href="index.html">回首頁</a></p>
    </div>
  </div>

  <!-- QR Code 視窗 -->
  <div id="qrModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
    <div class="card">
      <div class="sheet-head">
        <h2 id="qrTitle">邀請裝置</h2>
        <button type="button" class="icon-btn" data-close aria-label="關閉"><svg class="ic" style="pointer-events:none"><use href="icons/sprite.svg?v=13#xmark"/></svg></button>
      </div>
      <div class="tabs">
        <button type="button" class="tab active" data-tab="view">監看</button>
        <button type="button" class="tab" data-tab="join">加入其他鏡頭</button>
      </div>
      <div class="qr" id="qrBox"></div>
      <p class="note" id="qrDesc"></p>
      <p class="note pin-note" id="pinNote"></p>
      <div class="row">
        <button type="button" id="btnCopy">複製連結</button>
        <button type="button" class="primary" data-close>完成</button>
      </div>
    </div>
  </div>

  <!-- 設定視窗 -->
  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="card">
      <div class="sheet-head">
        <h2 id="setTitle">鏡頭設定</h2>
        <button type="button" class="icon-btn" data-close aria-label="關閉"><svg class="ic" style="pointer-events:none"><use href="icons/sprite.svg?v=13#xmark"/></svg></button>
      </div>
      <label class="field">鏡頭名稱
        <input type="text" id="inpName" maxlength="20" placeholder="例如：客廳、嬰兒房">
      </label>
      <p class="note">房間代號 <b id="roomCode">----</b>　·　位置 <b id="slotNo">-</b>　·　配對碼 <b id="pinText2">----</b></p>
      <p class="small">網路代碼 <b id="netCodes">偵測中…</b></p>
      <div class="row">
        <button type="button" class="danger" id="btnNewRoom">建立新房間</button>
        <button type="button" class="primary" data-close>完成</button>
      </div>
      <p class="small">建立新房間後，所有裝置需重新加入。</p>
    </div>
  </div>

  <script src="vendor/peerjs.min.js?v=13"></script>
  <script src="vendor/qrcode.js?v=13"></script>
  <script src="js/config.js?v=13"></script>
  <script src="js/common.js?v=13"></script>
  <script src="js/camera.js?v=13"></script>
</body>
</html>
